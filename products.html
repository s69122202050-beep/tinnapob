<!DOCTYPE html>
<html lang="th">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>สินค้าทุเรียน | มหาเทพเติ้ล789</title>

    <link rel="stylesheet" href="style.css">

</head>

<body>


<header class="header">

    <div class="logo-area">

        <img src="durian.png"
             class="logo"
             alt="โลโก้ทุเรียน">

        <div>

            <h1>มหาเทพเติ้ล789</h1>

            <p>by ทุเรียนเติ้ลจันรี</p>

        </div>

    </div>


    <nav>

        <a href="index.html">หน้าแรก</a>

        <a href="products.html">สินค้า</a>

        <a href="logic.html">Set Logic</a>

    </nav>

</header>


<section class="products-page">

    <div class="section-title">

        <span>OUR PRODUCTS</span>

        <h2>🥭 รายการทุเรียน</h2>

        <p>
            เลือกทุเรียนที่ต้องการ
        </p>

    </div>


    <!-- หมวดหมู่ -->

    <div class="category-buttons">

        <button onclick="filterProducts('all')">
            ทั้งหมด
        </button>

        <button onclick="filterProducts('หมอนทอง')">
            หมอนทอง
        </button>

        <button onclick="filterProducts('ก้านยาว')">
            ก้านยาว
        </button>

        <button onclick="filterProducts('ชะนี')">
            ชะนี
        </button>

    </div>


    <!-- รายการสินค้า -->

    <div id="productList"
         class="product-grid">

    </div>


    <!-- CART -->

    <div class="cart-box">

        <h2>🛒 ตะกร้าสินค้า</h2>

        <div id="cartItems">
            ยังไม่มีสินค้า
        </div>

        <hr>

        <p>
            ราคาสินค้า:
            <strong id="subtotal">
                0 บาท
            </strong>
        </p>

        <p>
            ส่วนลด:
            <strong id="discount">
                0 บาท
            </strong>
        </p>

        <h3>
            ยอดสุทธิ:
            <span id="total">
                0 บาท
            </span>
        </h3>

        <button class="checkout-btn"
                onclick="checkout()">

            🛒 สั่งซื้อสินค้า

        </button>

    </div>

</section>


<footer>

    <img src="durian.png"
         class="footer-logo"
         alt="โลโก้">

    <h3>มหาเทพเติ้ล789</h3>

    <p>by ทุเรียนเติ้ลจันรี</p>

</footer>


<script src="script.js"></script>

</body>
</html>
