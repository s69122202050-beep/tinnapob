<!DOCTYPE html>
<html lang="th">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>
        สินค้า | มหาเทพเติ้ล789

    <link rel="stylesheet"
          href="style.css">

</head>


<body>


<header>

    <div class="logo-area">

        <img src="images/logo.png"
             alt="Logo">

        <div>

            <h2>
                มหาเทพเติ้ล789
            </h2>

            <p>
                by ทุเรียนเติ้ลจันรี
            </p>

        </div>

    </div>


    <nav>

        <a href="index.html">
            หน้าแรก
        </a>

        <a class="active"
           href="products.html">
            สินค้า
        </a>

        <a href="logic.html">
            Set Logic
        </a>

    </nav>

</header>


<section class="section">


<div class="title">

    <span>OUR PRODUCTS</span>

    <h1>
        🥭 รายการทุเรียน
    </h1>

    <p>
        เลือกสายพันธุ์ทุเรียนที่ต้องการ
    </p>

</div>


<div class="filter">

    <button onclick="showProducts('ทั้งหมด')">
        ทั้งหมด
    </button>

    <button onclick="showProducts('หมอนทอง')">
        หมอนทอง
    </button>

    <button onclick="showProducts('ก้านยาว')">
        ก้านยาว
    </button>

    <button onclick="showProducts('ชะนี')">
        ชะนี
    </button>

</div>


<div id="productList"
     class="product-grid">
</div>


<div class="cart">

    <h2>
        🛒 ตะกร้าสินค้า
    </h2>

    <div id="cartItems">

        ยังไม่มีสินค้าในตะกร้า

    </div>

    <p>
        ราคาสินค้า:
        <b id="subtotal">0</b>
        บาท
    </p>


    <p>
        ส่วนลด:
        <b id="discount">0</b>
        บาท
    </p>


    <h2>
        ยอดสุทธิ:
        <b id="total">0</b>
        บาท
    </h2>


    <button class="checkout"
            onclick="checkout()">

        🛒 สั่งซื้อสินค้า

    </button>

</section>


<footer>

    <h3>
        มหาเทพเติ้ล789
